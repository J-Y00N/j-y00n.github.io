---
layout: default
---
<article class="entry">
  <header class="entry-header">
    <h1 class="entry-title">{{ page.title | escape }}</h1>
    {% if page.date %}
    <p class="entry-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>
    {% endif %}
  </header>
  {{ content }}
  <p class="entry-back"><a href="{{ '/notes/' | relative_url }}">&larr; All notes</a></p>
</article>
