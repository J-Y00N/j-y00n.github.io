<footer class="site-footer">
  {% include visible-profile-links.html %}
  {% if visible_profile_links.size > 0 %}
  <p class="footer-links">
    {% for link in visible_profile_links %}
    <a {% include profile-link-href.html link=link %}>{{ link.label | escape }}</a>
    {% endfor %}
  </p>
  {% endif %}
  <p>© {{ 'now' | date: '%Y' }} {{ site.title }}. Built with GitHub Pages and Jekyll.</p>
</footer>
