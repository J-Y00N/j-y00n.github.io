title: 'J. Yoon'
author: 'J. Yoon'
description: 'Academic website for research interests, projects, notes, and application materials'
url: 'https://j-y00n.github.io'
baseurl: ''
lang: 'en'
timezone: 'Asia/Seoul'
markdown: kramdown
permalink: pretty

# Build entries dated in the future too, so list links never point to a missing page.
future: true

# Turn off the default GitHub Pages theme (Primer). This site has its own layouts and styles.
theme: null

# A custom exclude list replaces Jekyll's defaults, so Gemfile and vendor/ are listed here too.
exclude:
  - README.md
  - LICENSE
  - bin/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Old addresses listed under redirect_from in front matter forward to their new page.
redirect_from:
  json: false

# jekyll-feed always builds a posts feed, even without _posts.
# Move it to /feed/posts.xml so the notes feed can use /feed.xml.
feed:
  path: /feed/posts.xml
  collections:
    notes:
      path: /feed.xml

# _pages is a plain page folder. A collection named "pages" would hide site.pages in Liquid.
include:
  - _pages

# Projects and publications are summaries that link out, so they have no pages of their own.
# Note URLs drop the date prefix of the file name: 2026-03-19-my-note.md -> /notes/my-note/
collections:
  publications:
    output: false
  projects:
    output: false
  notes:
    output: true
    permalink: /notes/:slug/

defaults:
  - scope:
      path: ''
    values:
      layout: default
      image: /assets/images/profile.png
      twitter:
        card: summary
  # Pages in _pages get /file-name/ URLs unless they set their own permalink.
  - scope:
      path: '_pages'
    values:
      permalink: /:basename/
      layout: page
  - scope:
      path: ''
      type: notes
    values:
      layout: note
